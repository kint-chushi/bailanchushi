<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>KLM Lyric Tracker Player</title>
    <style>
        /* 基础重置与容器样式 */
        body { margin: 0; padding: 20px 0; background: #050510; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .klm_split_k2_box * { margin: 0; padding: 0; box-sizing: border-box; }
        .klm_split_k2_box {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            width: 100%; max-width: 420px; height: auto; max-height: 980px;
            margin: 0 auto;
            background: linear-gradient(160deg, #0b0b1a 0%, #151030 50%, #0a1628 100%);
            color: #e0e0e0; padding: 14px 12px; line-height: 1.5;
            overflow: hidden; border-radius: 12px;
            position: relative;
        }

        /* 动画定义 */
        @keyframes klm_border_glow { 0% { border-color: rgba(124,92,255,.35); } 50% { border-color: rgba(80,200,255,.4); } 100% { border-color: rgba(124,92,255,.35); } }
        @keyframes klm_shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes klm_eq { 0%,100% { height: 3px; } 50% { height: 12px; } }
        @keyframes klm_lyric_in { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes klm_bar_flow { 0% { transform: scaleX(.3); } 50% { transform: scaleX(1); } 100% { transform: scaleX(.3); } }

        /* 组件样式 */
        .klm_outer_fs {
            border: 1px solid rgba(124,92,255,.3); border-radius: 14px;
            padding: 14px 10px 10px;
            background: rgba(12,10,35,.7);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            animation: klm_border_glow 6s ease infinite;
        }
        .klm_outer_fs legend {
            font-size: 13px; font-weight: 700; color: transparent;
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #f472b6, #a78bfa);
            background-size: 300% 100%;
            -webkit-background-clip: text; background-clip: text;
            animation: klm_shimmer 5s linear infinite;
            padding: 2px 12px; letter-spacing: 1px;
        }

        .klm_nav { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 8px; }
        .klm_nav_btn {
            width: 36px; height: 36px; border: 1px solid rgba(124,92,255,.3);
            border-radius: 50%; background: rgba(124,92,255,.1); color: #c4b5fd;
            font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all .2s; -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .klm_nav_btn:active { background: rgba(124,92,255,.35); transform: scale(.92); }
        
        .klm_song_info { text-align: center; flex: 1; padding: 0 8px; overflow: hidden; }
        .klm_song_title { font-size: 14px; font-weight: 700; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .klm_song_artist { font-size: 10px; color: rgba(167,139,250,.7); margin-top: 2px; display: block; }
        
        .klm_eq_row { display: flex; justify-content: center; align-items: flex-end; gap: 2px; height: 14px; margin-top: 4px; }
        .klm_eq_bar { width: 2px; background: linear-gradient(to top, #7c5cff, #50c8ff); border-radius: 1px; animation: klm_eq .8s ease-in-out infinite; }

        .klm_audio_box { padding: 4px 6px; background: rgba(124,92,255,.06); border-radius: 8px; border: 1px solid rgba(124,92,255,.12); margin: 6px 0 8px; }
        .klm_audio_box audio { width: 100%; height: 34px; border-radius: 6px; filter: hue-rotate(240deg) brightness(.8); outline: none; }
        
        .klm_progress_bar { height: 2px; background: rgba(124,92,255,.15); border-radius: 1px; margin: 4px 0 0; overflow: hidden; }
        .klm_progress_fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7c5cff, #50c8ff); border-radius: 1px; transition: width .3s linear; }

        .klm_lyrics_fs { border: 1px solid rgba(124,92,255,.15); border-radius: 10px; margin: 0; padding: 0; background: rgba(8,6,25,.6); overflow: hidden; }
        .klm_lyrics_fs legend { font-size: 10px; color: rgba(129,140,248,.7); padding: 0 8px; letter-spacing: 1px; }
        
        .klm_lyrics_scroll {
            height: 420px; overflow-y: auto; padding: 10px 12px;
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }
        .klm_lyrics_scroll::-webkit-scrollbar { width: 2px; }
        .klm_lyrics_scroll::-webkit-scrollbar-thumb { background: rgba(124,92,255,.3); border-radius: 1px; }
        .klm_lyrics_scroll::-webkit-scrollbar-track { background: transparent; }

        .klm_lyric_line { padding: 6px 0; opacity: .3; transition: all .35s ease; border-bottom: 1px solid rgba(124,92,255,.04); }
        .klm_lyric_line.klm_active { opacity: 1; animation: klm_lyric_in .35s ease; }
        .klm_lyric_line.klm_past { opacity: .5; }
        
        .klm_lyric_en { font-size: 13px; color: #cbd5e1; font-weight: 500; line-height: 1.45; word-break: break-word; display: block; }
        .klm_lyric_cn { font-size: 11px; color: rgba(167,139,250,.7); margin-top: 2px; line-height: 1.4; padding-left: 6px; border-left: 2px solid rgba(124,92,255,.2); display: block; }
        
        .klm_active .klm_lyric_en { color: #fff; font-weight: 600; }
        .klm_active .klm_lyric_cn { color: rgba(196,181,253,.9); border-left-color: rgba(124,92,255,.6); }
        
        .klm_time_badge { display: inline-block; font-size: 9px; color: #6366f1; background: rgba(99,102,241,.1); padding: 0 5px; border-radius: 3px; font-family: monospace; margin-bottom: 2px; letter-spacing: .3px; }
        .klm_active .klm_time_badge { background: rgba(99,102,241,.25); color: #a78bfa; }

        .klm_footer_bar { display: flex; justify-content: center; align-items: center; gap: 4px; padding: 8px 0 2px; }
        .klm_dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(124,92,255,.25); transition: all .3s; }
        .klm_dot.klm_dot_active { background: #7c5cff; box-shadow: 0 0 6px rgba(124,92,255,.5); }
        
        .klm_wave { display: flex; justify-content: center; gap: 2px; padding: 4px 0; }
        .klm_wave_bar { width: 14px; height: 2px; background: rgba(124,92,255,.25); border-radius: 1px; animation: klm_bar_flow 1.8s ease infinite; }
    </style>
</head>

        klm_src.src = song.src;
        klm_audio.load();
        klm_lastIdx = -1;
        var h = "";
        for (var i = 0; i < song.lyrics.length; i++) {
            var l = song.lyrics[i];
            h += '<p class="klm_lyric_line" id="klm_l_' + i + '">';
            h += '<span class="klm_time_badge">' + klmFmt(l[0]) + '</span><br>';
            h += '<span class="klm_lyric_en">' + l[1] + '</span><br>';
            h += '<span class="klm_lyric_cn">' + l[2] + '</span>';
            h += '</p>';
        }
        klm_box.innerHTML = h;
        klm_box.scrollTop = 0;
        for (var d = 0; d < 3; d++) {
            var dot = document.getElementById("klm_dot_" + d);
            dot.className = d === klm_cur ? "klm_dot klm_dot_active" : "klm_dot";
        }
    }

    function klmSwitch(dir) {
        klm_audio.pause();
        klm_cur = (klm_cur + dir + 3) % 3;
        klmRender();
    }

    klm_audio.addEventListener("timeupdate", function () {
        var t = klm_audio.currentTime;
        var song = klm_songs[klm_cur];
        var dur = klm_audio.duration || 1;
        klm_prog.style.width = (t / dur * 100) + "%";
        var idx = -1;
        for (var i = song.lyrics.length - 1; i >= 0; i--) {
            if (t >= song.lyrics[i][0]) { idx = i; break; }
        }
        if (idx !== klm_lastIdx) {
            var lines = klm_box.querySelectorAll(".klm_lyric_line");
            for (var j = 0; j < lines.length; j++) {
                if (j < idx) { lines[j].className = "klm_lyric_line klm_past"; }
                else if (j === idx) { lines[j].className = "klm_lyric_line klm_active"; }
                else { lines[j].className = "klm_lyric_line"; }
            }
            if (idx >= 0) {
                var el = document.getElementById("klm_l_" + idx);
                if (el) {
                    var top = el.offsetTop - klm_box.offsetTop;
                    var boxH = klm_box.clientHeight;
                    klm_box.scrollTop = top - boxH / 3;
                }
            }
            klm_lastIdx = idx;
        }
    });

    // 初始化渲染
    klmRender();
</script>

</body>
</html>
